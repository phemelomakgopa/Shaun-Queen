    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }

        /* ── Music waveform bars ── */
        @keyframes bar {
            0%, 100% { transform: scaleY(0.4); }

        .music-btn:focus .music-tooltip {

        const EpisodeCard = ({ episode, activeId, setActiveId }) => {
            const hoverTimerRef = useRef(null);
            const videoRef      = useRef(null);
            const isActive      = activeId === episode.id;

            const handleMouseEnter = useCallback(() => {
                hoverTimerRef.current = setTimeout(() => setActiveId(episode.id), 400);
            }, [episode.id, setActiveId]);

            const handleMouseLeave = useCallback(() => {
                if (hoverTimerRef.current) clearTimeout(hoverTimerRef.current);
                setActiveId(null);
            }, [setActiveId]);

            useEffect(() => {
                const vid = videoRef.current;
                if (!vid) return;
                if (isActive) {
                    vid.currentTime = 0;
                    vid.play().catch(() => {});
                } else {
                    vid.pause();
                }
            }, [isActive]);

                            <span className="text-white">Destiny</span>
                        </div>
                    </div>
                    </div>
                </div>
            </motion.div>
        );

        // ─────────────────────────────────────────────────────────────────────────────
        // PLAY MODAL
        // ─────────────────────────────────────────────────────────────────────────────

        const PlayModal = ({ isOpen, onClose }) => {
            const [text, setText] = useState("");
            const fullText = "Every love story is beautiful, but ours is my favorite. I love you, Queen.";
            const vidRef = useRef(null);

            useEffect(() => {
                if (!isOpen) return;
                setText("");
                let i = 0;
                const timer = setInterval(() => {
                    setText(fullText.slice(0, i));
                    i++;
                    if (i > fullText.length) clearInterval(timer);
                }, 50);
                return () => clearInterval(timer);
            }, [isOpen]);

            useEffect(() => {
                const vid = vidRef.current;
                if (!vid) return;
                if (isOpen) { vid.currentTime = 0; vid.play().catch(() => {}); }
                else { vid.pause(); }
            }, [isOpen]);

            if (!isOpen) return null;

            return (
                <AnimatePresence>
                    <motion.div
                        initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }}
                        className="fixed inset-0 z-50 bg-black flex flex-col items-center justify-center p-4 md:p-8"
                    >
                        <button
                            onClick={onClose}
                            className="absolute top-6 right-6 md:top-8 md:right-8 text-white hover:text-gray-300 transition-colors z-10"
                        >
                            <Icon name="x" className="w-8 h-8 md:w-10 md:h-10" />
                        </button>

                        <div
                            className="relative max-w-3xl w-full rounded-lg overflow-hidden shadow-2xl mb-6 md:mb-8"
                            style={{ aspectRatio: '16/9' }}
                        >
                            <video
                                ref={vidRef}
                                src="Assets/Videos/KampStud2.mp4"
                                loop
                                playsInline
                                className="w-full h-full object-cover cinematic-filter"
                            />
                            <div className="absolute bottom-3 right-3 md:bottom-4 md:right-4 pointer-events-none">
                                <motion.div
                                    animate={{ scale: [1, 1.2, 1], opacity: [0.7, 1, 0.7] }}
                                    transition={{ repeat: Infinity, duration: 2, ease: "easeInOut" }}
                                >
                                    <Icon name="heart" className="w-6 h-6 md:w-8 md:h-8 text-netflix fill-netflix" />
                                </motion.div>
                            </div>
                        </div>

                        <p className="text-white font-playfair text-xl md:text-4xl italic text-center px-4" style={{ minHeight: '3rem' }}>
                            {text}<span className="animate-pulse">|</span>
                        </p>
                    </motion.div>
                </AnimatePresence>
            );
        };

        // ─────────────────────────────────────────────────────────────────────────────
        // APP
        // ─────────────────────────────────────────────────────────────────────────────

        const App = () => {
            const [showIntro,       setShowIntro]       = useState(true);
            const [isPlayModalOpen, setIsPlayModalOpen] = useState(false);
            const [audioPlaying,    setAudioPlaying]    = useState(false);
            const [activeEpisodeId, setActiveEpisodeId] = useState(null);
            const audioRef     = useRef(null);
            const audioStarted = useRef(false);

            const toggleAudio = () => {
                const audio = audioRef.current;
                if (!audio) return;
                if (!audioStarted.current) {
                    // First click: start the song, unmuted
                    audio.muted  = false;
                    audio.volume = 0.6;
                    audio.play().catch(() => {});
                    audioStarted.current = true;
                    setAudioPlaying(true);
                } else {
                    // All later clicks: mute/unmute only — song keeps running in background
                    audio.muted = !audio.muted;
                    setAudioPlaying(!audio.muted);
                }
            };

            return (
                <div className="relative min-h-screen bg-dark">
                    {/*
                        SOUNDTRACK:
                        Drop your favourite song as an MP3 at  Assets/Sounds/soundtrack.mp3
                        The music icon (bottom-right) will play it in the background.
                        It is completely invisible — no popup, no new tab, pure atmosphere.
                    */}
                    <audio ref={audioRef} src="Assets/Sounds/SoundTrack1.mp3" loop />

                    <AnimatePresence>
                        {showIntro && <Intro onComplete={() => setShowIntro(false)} />}
                    </AnimatePresence>

                    {!showIntro && (
                        <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} transition={{ duration: 1 }}>
                            <Navbar />

                            {/*
                                TWO HEROES:
                                • HeroMobile  → shown on screens BELOW md (portrait phones)
                                • HeroDesktop → shown on screens md AND ABOVE (tablets, laptops, desktops)
                                Each has its own background image. Change the src inside each component.
                            */}
                            <HeroMobile  onPlayClick={() => setIsPlayModalOpen(true)} />
                            <HeroDesktop onPlayClick={() => setIsPlayModalOpen(true)} />

                            <div className="relative z-20 mt-4 md:-mt-24 pb-12">
                                <HorizontalRow title="Our Episodes">
                                    {EPISODES.map(ep => (
                                        <EpisodeCard
                                            key={ep.id}
                                            episode={ep}
                                            activeId={activeEpisodeId}
                                            setActiveId={setActiveEpisodeId}
                                        />
                                    ))}
                                </HorizontalRow>
                            </div>

                            <AboutSection />

                            <footer className="py-8 text-center border-t border-[#2f2f2f] space-y-2">
                                <p className="text-gray-500 text-sm">Made with love😘 by Shaun · For Queen · Season 2 · 2026</p>
                                <p className="text-gray-600 text-xs">
                                    Powered by{' '}
                                    <a
                                        href="https://www.webinnovationnexus.com"
                                        target="_blank"
                                        rel="noopener noreferrer"
                                        className="text-gray-400 hover:text-white underline underline-offset-2 transition-colors"
                                    >
                                        Web Innovation Nexus
                                    </a>
                                </p>
                            </footer>

                            {/*
                                MUSIC BUTTON (bottom-right corner)
                                ─────────────────────────────────
                                When NOT playing → music note icon, grey.
                                When playing     → three animated red bars (waveform) like Spotify.
                                Tooltip appears on hover to hint what it does.
                                The song plays silently in the background — pure atmosphere.
                            */}
                            <button
                                onClick={toggleAudio}
                                className="music-btn fixed bottom-6 right-6 z-40 w-11 h-11 bg-[#181818]/90 backdrop-blur-sm border border-white/10 rounded-full flex items-center justify-center text-gray-400 hover:text-white hover:scale-110 transition-all shadow-xl"
                                aria-label={audioPlaying ? "Pause our soundtrack" : "Play our soundtrack"}
                            >
                                {audioPlaying ? (
                                    /* Animated waveform bars when playing */
                                    <div className="flex items-end gap-[3px] h-4">
                                        <span className="bar" />
                                        <span className="bar" />
                                        <span className="bar" />
                                    </div>
                                ) : (
                                    <Icon name="music" className="w-4 h-4" />
                                )}
                                {/* Tooltip */}
                                <span className="music-tooltip">
                                    {audioPlaying ? "⏸ Pause our song" : "♪ Play our song"}
                                </span>
                            </button>

                            <PlayModal
                                isOpen={isPlayModalOpen}
                                onClose={() => setIsPlayModalOpen(false)}
                            />
                        </motion.div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body></html>
